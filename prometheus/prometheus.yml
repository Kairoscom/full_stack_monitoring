# ============================================
# Prometheus 主配置
# 作者: wangx
# 作用: 告诉 Prometheus 采集哪些目标、应用哪些告警规则
# ============================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'remote-server-monitor'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - "alerts/*.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'
          instance_role: 'host'

  - job_name: 'site_check'
    static_configs:
      - targets: ['site_check:9877']
        labels:
          service: 'site-check'
          instance_role: 'business'
    scrape_interval: 30s
